<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

  :root { color-scheme: light dark; }

  p { color:#5a6478; font-size:.9rem; margin:0 0 32px; }
  a.card { display:block; text-align:left; text-decoration:none; color:inherit;
           background:#fff; border:1px solid #e2e6ee; border-radius:12px;
           padding:18px 20px; margin-bottom:12px; transition:.15s; }
  a.card:hover { border-color:#2f6fed; transform:translateY(-1px); }
  a.card b { display:block; font-size:1rem; margin-bottom:4px; }
  a.card span { font-size:.82rem; color:#5a6478; }
  @media (prefers-color-scheme: dark) {
    body { background:#12161f; color:#e8ecf4; }
    a.card { background:#1b212d; border-color:#2b3342; }
    p, a.card span { color:#9aa5ba; }
